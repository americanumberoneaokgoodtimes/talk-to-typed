[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.1.0"
description = "Offline speech-to-text CLI built on sherpa-onnx"
requires-python = ">=3.10"
dependencies = ["sherpa-onnx", "numpy", "soundfile"]

[project.scripts]
stt = "stt.cli:main"

[tool.setuptools]
packages = ["stt"]
